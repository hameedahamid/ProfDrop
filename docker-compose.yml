services:
  api:
    build:
      context: .
      dockerfile: ProfDropFunctions/Dockerfile
    ports:
      - "7293:80"
    environment:
      FUNCTIONS_WORKER_RUNTIME: dotnet-isolated
      AzureWebJobsStorage: ${AZURE_STORAGE_CONNECTION_STRING}

  web:
    build:
      context: .
      dockerfile: ProfDropMVC/Dockerfile
    ports:
      - "7216:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ProfDropApi__BaseUrl: http://api/api/
    depends_on:
      - api